plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven { url "https://maven.architectury.dev/" }
    maven {
        url "https://maven.saps.dev/minecraft"
        content {
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
            includeGroup "dev.architectury"
        }
    }
    maven {
        url "https://maven.blamejared.com"
    }
    maven {
        url "https://api.modrinth.com/maven"
    }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo sourceSets.test

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.test
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},minecraft"
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.test)
        }
        "mat" {
            sourceSet(project(':mat').sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation "dev.architectury:architectury-neoforge:${architectury_version}"
//    localRuntime "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    compileOnly "maven.modrinth:cc-tweaked:1.120.0-neoforge"
    localRuntime "maven.modrinth:cc-tweaked:1.120.0-neoforge"
    compileOnly "maven.modrinth:jade:${jade_version}"
//    localRuntime "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
    localRuntime "maven.modrinth:iris:1.8.8+1.21.1-neoforge"

    compileOnly "curse.maven:dyenamics-509276:6504540"
    localRuntime "curse.maven:dyenamics-509276:6504540"

    testImplementation "maven.modrinth:cc-tweaked:1.120.0-neoforge"
    testImplementation "maven.modrinth:jade:${jade_version}"
    testImplementation "curse.maven:dyenamics-509276:6504540"
    testImplementation project(':mat')
    localRuntime project(':mat')


    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            architectury_version   : architectury_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

var generateColorResources = tasks.register("generateColorResources") {
    var outputDir = file("build/generated/sources/colorResources")
    outputs.dir(outputDir)

    var templatesDir = file("src/main/templates/color_resources")
    inputs.dir(templatesDir)


    doLast {
        var colors = [
                "white", "orange", "magenta", "light_blue", "yellow", "lime", "pink", "gray",
                "light_gray", "cyan", "purple", "blue", "brown", "green", "red", "black"
        ]

//        dyenamics
        var dyenamicColors = [
                "peach", "aquamarine", "fluorescent", "mint", "maroon", "bubblegum", "lavender", "persimmon", "cherenkov", "amber", "honey", "ultramarine", "spring_green", "rose", "navy", "icy_blue", "wine", "conifer"
        ]

        var allColors = colors + dyenamicColors
        var wallVariants = allColors + ["iron", "copper", "prismarine"]

        var getParticle = { variant ->
            if (variant == "iron") return "minecraft:block/iron_block"
            if (variant == "copper") return "searchlight:block/wall_light_copper"
            if (variant == "prismarine") return "minecraft:block/prismarine_bricks"
            if (variant in colors) return "minecraft:block/${variant}_terracotta"
            if (variant in dyenamicColors) return "dyenamics:block/${variant}_terracotta"
        }

        if (templatesDir.exists()) {
            templatesDir.eachFileRecurse(groovy.io.FileType.FILES) { templateFile ->
                var relativePath = templatesDir.toPath().relativize(templateFile.toPath()).toString().replace('\\', '/')

                if (relativePath.contains("@color@")) {
                    for (color in colors) {
                        var outPath = relativePath.replace("@color@", color)
                        var outFile = new File(outputDir, outPath)
                        outFile.parentFile.mkdirs()
                        outFile.text = templateFile.text
                                .replace("@color@", color)
                                .replace("@namespace@", "minecraft")
                    }
                    for (dColor in dyenamicColors) {
                        var outPath = relativePath.replace("@color@", dColor)
                        var outFile = new File(outputDir, outPath)
                        outFile.parentFile.mkdirs()
                        outFile.text = templateFile.text
                                .replace("@color@", dColor)
                                .replace("@namespace@", "dyenamics")
                    }

                } else if (relativePath.contains("@wall_variant@")) {
                    for (variant in wallVariants) {
                        var outPath = relativePath.replace("@wall_variant@", variant)
                        var outFile = new File(outputDir, outPath)
                        outFile.parentFile.mkdirs()

                        var particle = getParticle(variant)
                        outFile.text = templateFile.text
                                .replace("@wall_variant@", variant)
                                .replace("@particle@", particle)
                    }
                } else {
                    var outFile = new File(outputDir, relativePath)
                    outFile.parentFile.mkdirs()

                    var content = templateFile.text.replaceAll(/@list:([^:]+):([^@]+)@/) { match, prefix, placeholderType ->
                        var valuesList = (placeholderType == "color") ? allColors : wallVariants
                        valuesList.collect { "\"searchlight:${prefix}_${it}\"" }.join(",\n    ")
                    }
                    outFile.text = content
                }
            }
        }
    }
}
sourceSets.main.resources.srcDir generateColorResources
neoForge.ideSyncTask generateColorResources


// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:deprecation"
}

tasks.named('runClient') {
    jvmArgs '-Xmx1256M'
}

configurations {
    matGenerator
}

dependencies {
    matGenerator project(':mat')
}

var generateGameTestStructures = tasks.register("generateGameTestStructures", JavaExec) {
    classpath = configurations.matGenerator
    mainClass = 'com.mat.structure.MatStructureGenerator'

    var outputDir = file("build/generated/sources/gametestStructures")
    var javaSourceFiles = files(sourceSets.main.allJava, sourceSets.test.allJava)
    inputs.files(javaSourceFiles)
    outputs.dir(outputDir)

    args = [
            outputDir.absolutePath,
            mod_id,
            file("src/main/java").absolutePath,
            file("src/test/java").absolutePath
    ]
}
sourceSets.test.resources.srcDir generateGameTestStructures
neoForge.ideSyncTask generateGameTestStructures

// Configure test and check tasks so running ./gradlew test or ./gradlew check executes GameTests across all subfolders
tasks.named('test') {
    failOnNoDiscoveredTests = false
    dependsOn 'runGameTestServer'
}

tasks.named('check') {
    dependsOn 'runGameTestServer'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
