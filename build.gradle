import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven { url "https://maven.architectury.dev/" }
    maven {
        url "https://maven.saps.dev/minecraft"
        content {
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
            includeGroup "dev.architectury"
        }
    }
    maven {
        url "https://maven.blamejared.com"
    }
    maven {
        url "https://api.modrinth.com/maven"
    }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo sourceSets.test

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
        }
        ciClient {
            jvmArgument "-Xmx1256M"
            systemProperty 'ciClient', 'true'
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.test
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},minecraft"
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.test)
        }
        "mat" {
            sourceSet(project(':mat').sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation "dev.architectury:architectury-neoforge:${architectury_version}"
    localRuntime "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    compileOnly "maven.modrinth:cc-tweaked:1.120.0-neoforge"
    localRuntime "maven.modrinth:cc-tweaked:1.120.0-neoforge"
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
    localRuntime "maven.modrinth:iris:1.8.8+1.21.1-neoforge"

    compileOnly "curse.maven:dyenamics-509276:6504540"
    localRuntime "curse.maven:dyenamics-509276:6504540"

    testImplementation "maven.modrinth:cc-tweaked:1.120.0-neoforge"
    testImplementation "maven.modrinth:jade:${jade_version}"
    testImplementation "curse.maven:dyenamics-509276:6504540"
    testImplementation project(':mat')
    localRuntime project(':mat')


    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            architectury_version   : architectury_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

var generateColorResources = tasks.register("generateColorResources") {
    var outputDir = file("build/generated/sources/colorResources")
    outputs.dir(outputDir)

    var templatesDir = file("src/main/templates/color_resources")
    inputs.dir(templatesDir)
    var staticLangFile = file("src/main/resources/assets/searchlight/lang/en_us.json")
    inputs.file(staticLangFile)


    doLast {
        var colors = [
                "white", "orange", "magenta", "light_blue", "yellow", "lime", "pink", "gray",
                "light_gray", "cyan", "purple", "blue", "brown", "green", "red", "black"
        ]

//        dyenamics
        var dyenamicColors = [
                "peach", "aquamarine", "fluorescent", "mint", "maroon", "bubblegum", "lavender", "persimmon", "cherenkov", "amber", "honey", "ultramarine", "spring_green", "rose", "navy", "icy_blue", "wine", "conifer"
        ]

        var allColors = colors + dyenamicColors
        var wallVariants = allColors + ["iron", "copper", "prismarine"]

        var getParticle = { variant ->
            if (variant == "iron") return "minecraft:block/iron_block"
            if (variant == "copper") return "searchlight:block/wall_light_copper"
            if (variant == "prismarine") return "minecraft:block/prismarine_bricks"
            if (variant in colors) return "minecraft:block/${variant}_terracotta"
            if (variant in dyenamicColors) return "dyenamics:block/${variant}_terracotta"
        }

        if (templatesDir.exists()) {
            templatesDir.eachFileRecurse(groovy.io.FileType.FILES) { templateFile ->
                var relativePath = templatesDir.toPath().relativize(templateFile.toPath()).toString().replace('\\', '/')

                if (relativePath.contains("@color@")) {
                    for (color in colors) {
                        var outPath = relativePath.replace("@color@", color)
                        var outFile = new File(outputDir, outPath)
                        outFile.parentFile.mkdirs()
                        outFile.text = templateFile.text
                                .replace("@color@", color)
                                .replace("@namespace@", "minecraft")
                    }
                    for (dColor in dyenamicColors) {
                        var outPath = relativePath.replace("@color@", dColor)
                        var outFile = new File(outputDir, outPath)
                        outFile.parentFile.mkdirs()
                        outFile.text = templateFile.text
                                .replace("@color@", dColor)
                                .replace("@namespace@", "dyenamics")
                    }

                } else if (relativePath.contains("@wall_variant@")) {
                    for (variant in wallVariants) {
                        var outPath = relativePath.replace("@wall_variant@", variant)
                        var outFile = new File(outputDir, outPath)
                        outFile.parentFile.mkdirs()

                        var particle = getParticle(variant)
                        outFile.text = templateFile.text
                                .replace("@wall_variant@", variant)
                                .replace("@particle@", particle)
                    }
                } else {
                    var outFile = new File(outputDir, relativePath)
                    outFile.parentFile.mkdirs()

                    var content = templateFile.text.replaceAll(/@list:([^:]+):([^@]+)@/) { match, prefix, placeholderType ->
                        var valuesList = (placeholderType == "color") ? allColors : wallVariants
                        valuesList.collect { "\"searchlight:${prefix}_${it}\"" }.join(",\n    ")
                    }
                    outFile.text = content
                }
            }
        }

        // Generate en_us locale strings for all color block families
        var colorDisplayNames = [
                // Vanilla
                "white": "White",
                "orange": "Orange",
                "magenta": "Magenta",
                "light_blue": "Light Blue",
                "yellow": "Yellow",
                "lime": "Lime",
                "pink": "Pink",
                "gray": "Gray",
                "light_gray": "Light Gray",
                "cyan": "Cyan",
                "purple": "Purple",
                "blue": "Blue",
                "brown": "Brown",
                "green": "Green",
                "red": "Red",
                "black": "Black",
                // Dyenamics
                "peach": "Peach",
                "aquamarine": "Aquamarine",
                "fluorescent": "Fluorescent",
                "mint": "Mint",
                "light_mint": "Light Mint",
                "maroon": "Maroon",
                "bubblegum": "Bubblegum",
                "lavender": "Lavender",
                "persimmon": "Persimmon",
                "cherenkov": "Cherenkov",
                "amber": "Amber",
                "honey": "Honey",
                "ultramarine": "Ultramarine",
                "spring_green": "Spring Green",
                "rose": "Rose",
                "navy": "Navy",
                "icy_blue": "Icy Blue",
                "wine": "Wine",
                "conifer": "Conifer"
        ]

        var wallMaterialNames = [
                "iron": "Iron",
                "copper": "Copper",
                "prismarine": "Prismarine"
        ]

        var colorFamilies = [
                "colour_lamp_slab": "Coloured Lamp Slab",
                "colour_lamp": "Coloured Lamp",
                "corner_light": "Corner Light",
                "centre_light": "Centre Light",
                "edge_light": "Edge Light",
                "searchlight": "Searchlight"
        ]

        var langMap = new LinkedHashMap()
        if (staticLangFile.exists()) {
            langMap.putAll(new JsonSlurper().parse(staticLangFile))
        }

        wallMaterialNames.each { key, name ->
            langMap["block.searchlight.wall_light_${key}"] = "${name} Wall Light".toString()
        }
        colorDisplayNames.each { key, name ->
            langMap["block.searchlight.wall_light_${key}"] = "${name} Wall Light".toString()
        }

        colorFamilies.each { prefix, suffix ->
            colorDisplayNames.each { key, name ->
                langMap["block.searchlight.${prefix}_${key}"] = "${name} ${suffix}".toString()
            }
        }

        var outLangFile = new File(outputDir, "assets/searchlight/lang/en_us.json")
        outLangFile.parentFile.mkdirs()
        outLangFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(langMap)) + "\n"

        var buildLangFile = new File(outputDir.parentFile.parentFile.parentFile, "resources/main/assets/searchlight/lang/en_us.json")
        if (buildLangFile.parentFile.exists()) {
            buildLangFile.text = outLangFile.text
        }
    }
}
sourceSets.main.resources.srcDir generateColorResources
neoForge.ideSyncTask generateColorResources

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

var generateShaderConfig = tasks.register("generateShaderConfig") {
    var inputBlockShaderFile = file("src/main/shader_files/block.properties")
    var outputBlockShaderFile = file("build/generated/sources/shaderConfig/block.properties")
    var inputItemShaderFile = file("src/main/shader_files/item.properties")
    var outputItemShaderFile = file("build/generated/sources/shaderConfig/item.properties")

    inputs.file(inputBlockShaderFile).optional()
    inputs.file(inputItemShaderFile).optional()
    outputs.file(outputBlockShaderFile)
    outputs.file(outputItemShaderFile)

    doLast {
        var baseColorGroups = [
                white: [
                        blockId: "block.21000",
                        itemId: "item.44097",
                        colors: ["white", "light_gray", "gray", "black"],
                        materials: ["iron"],
                        itemExtra: ["searchlight:searchlight"]
                ],
                brown: [
                        blockId: "block.21002",
                        itemId: "item.44043",
                        colors: ["brown"],
                        materials: [],
                        itemExtra: []
                ],
                red: [
                        blockId: "block.21004",
                        itemId: "item.44070",
                        colors: ["red", "maroon", "rose"],
                        materials: [],
                        itemExtra: []
                ],
                orange: [
                        blockId: "block.21006",
                        itemId: "item.44071",
                        colors: ["orange", "peach", "persimmon", "amber"],
                        materials: ["copper"],
                        itemExtra: []
                ],
                yellow: [
                        blockId: "block.21008",
                        itemId: "item.44072",
                        colors: ["yellow", "fluorescent", "honey"],
                        materials: [],
                        itemExtra: []
                ],
                lime: [
                        blockId: "block.21010",
                        itemId: "item.44073",
                        colors: ["lime", "mint", "light_mint", "spring_green"],
                        materials: [],
                        itemExtra: []
                ],
                green: [
                        blockId: "block.21012",
                        itemId: "item.44074",
                        colors: ["green", "conifer"],
                        materials: [],
                        itemExtra: []
                ],
                cyan: [
                        blockId: "block.21014",
                        itemId: "item.44075",
                        colors: ["cyan", "aquamarine"],
                        materials: ["prismarine"],
                        itemExtra: []
                ],
                light_blue: [
                        blockId: "block.21016",
                        itemId: "item.44076",
                        colors: ["light_blue", "cherenkov", "icy_blue"],
                        materials: [],
                        itemExtra: []
                ],
                blue: [
                        blockId: "block.21018",
                        itemId: "item.44077",
                        colors: ["blue", "ultramarine", "navy"],
                        materials: [],
                        itemExtra: []
                ],
                purple: [
                        blockId: "block.21020",
                        itemId: "item.44078",
                        colors: ["purple", "wine"],
                        materials: [],
                        itemExtra: []
                ],
                magenta: [
                        blockId: "block.21022",
                        itemId: "item.44079",
                        colors: ["magenta", "lavender"],
                        materials: [],
                        itemExtra: []
                ],
                pink: [
                        blockId: "block.21024",
                        itemId: "item.44080",
                        colors: ["pink", "bubblegum"],
                        materials: [],
                        itemExtra: []
                ]
        ]

        var getSearchlightBlockLines = { Map groupData ->
            var resultLines = []
            for (c in groupData.colors) {
                var blocks = [
                        "searchlight:searchlight:lit=true:color=${c}".toString(),
                        "searchlight:searchlight_${c}:lit=true".toString(),
                        "searchlight:searchlight_lightsource:color=${c}".toString(),
                        "searchlight:wall_light_${c}:lit=true".toString(),
                        "searchlight:corner_light_${c}:lit=true".toString(),
                        "searchlight:edge_light_${c}:lit=true".toString(),
                        "searchlight:centre_light_${c}:lit=true".toString(),
                        "searchlight:colour_lamp_${c}:lit=true".toString(),
                        "searchlight:colour_lamp_slab_${c}:lit=true".toString()
                ]
                resultLines.add(blocks.join(' '))
            }
            for (m in groupData.materials) {
                resultLines.add("searchlight:wall_light_${m}:lit=true".toString())
            }
            return resultLines
        }

        var getSearchlightItemLines = { Map groupData ->
            var resultLines = []
            if (groupData.containsKey('itemExtra') && !groupData.itemExtra.isEmpty()) {
                resultLines.add(groupData.itemExtra.join(' '))
            }
            for (c in groupData.colors) {
                var items = [
                        "searchlight:searchlight_${c}".toString(),
                        "searchlight:wall_light_${c}".toString(),
                        "searchlight:corner_light_${c}".toString(),
                        "searchlight:edge_light_${c}".toString(),
                        "searchlight:centre_light_${c}".toString(),
                        "searchlight:colour_lamp_${c}".toString(),
                        "searchlight:colour_lamp_slab_${c}".toString()
                ]
                resultLines.add(items.join(' '))
            }
            for (m in groupData.materials) {
                resultLines.add("searchlight:wall_light_${m}".toString())
            }
            return resultLines
        }

        var updateShaderProperties = { File inputFile, File outputFile, Map targetLinesMap ->
            var lines = inputFile.readLines('UTF-8')

            // 1. Remove existing searchlight tokens to avoid duplicates
            var cleanedLines = []
            for (line in lines) {
                if (line.contains('searchlight:')) {
                    var tokens = line.replace('\\', '').split(/\s+/)
                    var nonSearchlightTokens = tokens.findAll { it && !it.startsWith('searchlight:') }
                    if (!nonSearchlightTokens.isEmpty()) {
                        var trailing = line.trim().endsWith('\\') ? ' \\' : ''
                        cleanedLines.add(nonSearchlightTokens.join(' ') + trailing)
                    }
                } else {
                    cleanedLines.add(line)
                }
            }

            // 2. Find the last occurrence index of each target property ID
            var targetIds = targetLinesMap.keySet() as List<String>
            var lastIndices = [:]
            for (int i = 0; i < cleanedLines.size(); i++) {
                var trimmed = cleanedLines[i].trim()
                for (tid in targetIds) {
                    if (trimmed.startsWith(tid + ' ') || trimmed.startsWith(tid + '=')) {
                        lastIndices[tid] = i
                    }
                }
            }

            // 3. Insert the Searchlight entries in reverse order of index
            var sortedTids = targetIds.findAll { lastIndices.containsKey(it) }
                    .sort { a, b -> (lastIndices[b] as int) <=> (lastIndices[a] as int) }

            for (tid in sortedTids) {
                int idx = lastIndices[tid] as int
                int curr = idx
                while (curr < cleanedLines.size() && cleanedLines[curr].trim().endsWith('\\')) {
                    curr++
                }
                // Ensure the line before our searchlight additions ends with ' \'
                if (!cleanedLines[curr].trim().endsWith('\\')) {
                    cleanedLines[curr] = cleanedLines[curr].stripTrailing() + ' \\'
                }

                var slLines = targetLinesMap[tid] as List<String>
                var formattedLines = []
                for (int j = 0; j < slLines.size(); j++) {
                    if (j < slLines.size() - 1) {
                        formattedLines.add(slLines[j] + ' \\')
                    } else {
                        formattedLines.add(slLines[j])
                    }
                }
                cleanedLines.addAll(curr + 1, formattedLines)
            }

            outputFile.parentFile.mkdirs()
            outputFile.withWriter('UTF-8') { writer ->
                for (line in cleanedLines) {
                    writer.write(line)
                    writer.newLine()
                }
            }
        }

        if (inputBlockShaderFile.exists()) {
            var blockTargetLinesMap = [:]
            baseColorGroups.values().each { grp ->
                blockTargetLinesMap[grp.blockId] = getSearchlightBlockLines(grp)
            }
            updateShaderProperties(inputBlockShaderFile, outputBlockShaderFile, blockTargetLinesMap)
        } else {
            logger.warn("Block shader config file not found at: ${inputBlockShaderFile.absolutePath}")
        }

        if (inputItemShaderFile.exists()) {
            var itemTargetLinesMap = [:]
            baseColorGroups.values().each { grp ->
                itemTargetLinesMap[grp.itemId] = getSearchlightItemLines(grp)
            }
            updateShaderProperties(inputItemShaderFile, outputItemShaderFile, itemTargetLinesMap)
        } else {
            logger.warn("Item shader config file not found at: ${inputItemShaderFile.absolutePath}")
        }
    }
}
generateColorResources.configure {
    finalizedBy(generateShaderConfig)
}
neoForge.ideSyncTask generateShaderConfig


// Example configuration to allow publishing using the maven-publish plugin
