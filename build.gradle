var generateGameTestStructures = tasks.register("generateGameTestStructures", JavaExec) {
    classpath = configurations.matGenerator
    mainClass = 'com.mat.structure.MatStructureGenerator'

    var outputDir = file("build/generated/sources/gametestStructures")
    var javaSourceFiles = files(sourceSets.main.allJava, sourceSets.test.allJava)
    inputs.files(javaSourceFiles)
    outputs.dir(outputDir)

    args = [
            outputDir.absolutePath,
            mod_id,
            file("src/main/java").absolutePath,
            file("src/test/java").absolutePath
    ]
}
sourceSets.test.resources.srcDir generateGameTestStructures
neoForge.ideSyncTask generateGameTestStructures

// Configure test and check tasks so running ./gradlew test or ./gradlew check executes GameTests across all subfolders
tasks.named('test') {
    failOnNoDiscoveredTests = false
    dependsOn 'runGameTestServer'
}

tasks.named('check') {
    dependsOn 'runGameTestServer'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
